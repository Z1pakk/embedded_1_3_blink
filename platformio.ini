; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = blink_rgb

; Common settings shared by all programs
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor options
monitor_speed = 115200

; Each program lives in its own folder under src/ and has its own env
[env:blink]
build_src_filter = +<blink/>

[env:blink_hard_pattern]
build_src_filter = +<blink_hard_pattern/>

[env:blink_one_pin_2_leds]
build_src_filter = +<blink_one_pin_2_leds/>

[env:blink_rgb]
build_src_filter = +<blink_rgb/>
